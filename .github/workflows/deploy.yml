# Despliegue automático de la API de fraude aduanero en Azure Container Apps
# Se ejecuta en cada push a main o a mano desde la pestaña Actions (Run workflow).
# Cinco pasos y cinco secretos: AZURE_CREDENTIALS, ACR_USERNAME, ACR_PASSWORD,
# DATABRICKS_URL y DATABRICKS_TOKEN.
name: Desplegar API Fraude Aduanero

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  RESOURCE_GROUP: rg-mlops-ean          # reutilizado del Módulo 3
  ACR_NAME: acrmlopseanjcrios           # reutilizado del Módulo 3
  ENVIRONMENT: env-mlops-ean            # reutilizado del Módulo 3
  APP_NAME: api-aduanas-fraude          # Container App nueva del proyecto final
  MIN_REPLICAS: "0"                     # 0 = se apaga sin tráfico; 1 = siempre encendida
  API_VERSION: "2024-03-01"

jobs:
  desplegar:
    runs-on: ubuntu-24.04               # versión fija: evita cambios inesperados del runner
    steps:
      - name: "Paso 1 - Descargar el código del repositorio"
        uses: actions/checkout@v5           # versión que corre en Node.js 24

      - name: "Paso 2 - Autenticarse en Azure"
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          # Inicia sesión con el Service Principal usando la CLI de Azure (preinstalada en el runner)
          CLIENT_ID=$(echo "$AZURE_CREDENTIALS" | jq -r .clientId)
          CLIENT_SECRET=$(echo "$AZURE_CREDENTIALS" | jq -r .clientSecret)
          TENANT_ID=$(echo "$AZURE_CREDENTIALS" | jq -r .tenantId)
          SUBSCRIPTION_ID=$(echo "$AZURE_CREDENTIALS" | jq -r .subscriptionId)
          echo "::add-mask::$CLIENT_SECRET"
          az login --service-principal -u "$CLIENT_ID" -p "$CLIENT_SECRET" --tenant "$TENANT_ID" -o none
          az account set --subscription "$SUBSCRIPTION_ID"
          echo "Sesión iniciada en la suscripción $(az account show --query name -o tsv)"

      - name: "Paso 3 - Construir la imagen Docker"
        run: |
          IMAGE="$ACR_NAME.azurecr.io/$APP_NAME:${GITHUB_SHA}"   # cada versión con la etiqueta del commit
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -t "$IMAGE" .

      - name: "Paso 4 - Subir la imagen al Container Registry"
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          echo "$ACR_PASSWORD" | docker login "$ACR_NAME.azurecr.io" -u "$ACR_USERNAME" --password-stdin
          docker push "$IMAGE"

      - name: "Paso 5 - Desplegar en Azure Container Apps"
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          DB_URL: ${{ secrets.DATABRICKS_URL }}
          DB_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          set -e
          SUB=$(az account show --query id -o tsv)
          BASE="https://management.azure.com/subscriptions/$SUB/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App"
          ENV_ID="/subscriptions/$SUB/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/managedEnvironments/$ENVIRONMENT"
          APP_URL="$BASE/containerApps/$APP_NAME?api-version=$API_VERSION"

          # Región: la misma del Environment
          LOCATION=$(az rest --method get --url "$BASE/managedEnvironments/$ENVIRONMENT?api-version=$API_VERSION" --query location -o tsv)
          echo "Región del Environment: $LOCATION"

          # Definición completa de la Container App
          jq -n \
            --arg loc "$LOCATION" --arg env "$ENV_ID" --arg image "$IMAGE" \
            --arg server "$ACR_NAME.azurecr.io" --arg user "$ACR_USERNAME" --arg pass "$ACR_PASSWORD" \
            --arg url "$DB_URL" --arg token "$DB_TOKEN" --argjson minrep "$MIN_REPLICAS" \
            '{
              location: $loc,
              properties: {
                environmentId: $env,
                workloadProfileName: "Consumption",
                configuration: {
                  ingress: { external: true, targetPort: 8000 },
                  registries: [ { server: $server, username: $user, passwordSecretRef: "acr-password" } ],
                  secrets: [
                    { name: "acr-password", value: $pass },
                    { name: "databricks-url", value: $url },
                    { name: "databricks-token", value: $token }
                  ]
                },
                template: {
                  containers: [ {
                    name: "api",
                    image: $image,
                    resources: { cpu: 0.5, memory: "1Gi" },
                    env: [
                      { name: "DATABRICKS_URL", secretRef: "databricks-url" },
                      { name: "DATABRICKS_TOKEN", secretRef: "databricks-token" }
                    ]
                  } ],
                  scale: { minReplicas: $minrep, maxReplicas: 1 }
                }
              }
            }' > app.json

          # PUT crea la app la primera vez y la actualiza las siguientes
          az rest --method put --url "$APP_URL" --body @app.json -o none
          rm app.json

          # Espera hasta que Azure termine (máximo 10 minutos)
          for i in $(seq 1 60); do
            STATE=$(az rest --method get --url "$APP_URL" --query properties.provisioningState -o tsv)
            echo "Estado: $STATE"
            if [ "$STATE" = "Succeeded" ]; then break; fi
            if [ "$STATE" = "Failed" ]; then echo "El despliegue falló"; exit 1; fi
            sleep 10
          done
          if [ "$STATE" != "Succeeded" ]; then echo "Tiempo de espera agotado"; exit 1; fi

          FQDN=$(az rest --method get --url "$APP_URL" --query properties.configuration.ingress.fqdn -o tsv)
          echo "API publicada en: https://$FQDN"
          echo "Pruebe: https://$FQDN/health"
